<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF and Audio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 20px;
        }
        #result {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 class="card-title text-center">Upload PDF and Audio</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="pdf_file" class="form-label">PDF File:</label>
                    <input type="file" id="pdf_file" name="pdf_file" class="form-control" accept=".pdf" required>
                </div>
                <div class="mb-3">
                    <label for="audio_file" class="form-label">Audio File:</label>
                    <input type="file" id="audio_file" name="audio_file" class="form-control" accept="audio/*">
                </div>  
                <div class="mb-3">
                    <label for="audio_file" class="form-label">Text File:</label>
                    <textarea id="text_data" name="question" placeholder="Enter your question here..." class="form-control" ></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
            <div id="result" class="mt-4"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        
        const formData = new FormData();
        
        // Add the PDF file (required)
        const pdfFile = document.getElementById('pdf_file').files[0];
        if (!pdfFile) {
            alert('Please select a PDF file');
            return;
        }
        formData.append('pdf_file', pdfFile);
        
        // Add the question - use question_input as the parameter name
        const questionText = document.getElementById('text_data').value;
        formData.append('question_input', questionText);
        
        // Add the audio file if provided
        const audioFile = document.getElementById('audio_file').files[0];
        if (audioFile) {
            formData.append('audio_file', audioFile);
        }
        
        console.log('Submitting form with:')

        if (!audioFile){
            console.log('text . . .')
            const response = await fetch('/ask_text', {
            method: 'POST',
            body: formData
            });
            const result = await response.json();
            document.getElementById('result').textContent = JSON.stringify(result, null, 2);
        }
        else{
            console.log('audo . . .')
            const response = await fetch('/ask_audio', {
            method: 'POST',
            body: formData
            });
            const result = await response.json();
            document.getElementById('result').textContent = JSON.stringify(result, null, 2);
        }
        
    });
    </script>
</body>
</html>
